name: Build KLauncher (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows OneDir
    runs-on: windows-latest

    defaults:
      run:
        working-directory: github.com/its-Kobi/Klauncher/Klauncher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: github.com/its-Kobi/Klauncher/Klauncher/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verify sources compile
        run: python -m compileall -q .

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm KLauncher.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KLauncher-windows
          path: github.com/its-Kobi/Klauncher/Klauncher/dist/KLauncher
          if-no-files-found: error
          retention-days: 30
