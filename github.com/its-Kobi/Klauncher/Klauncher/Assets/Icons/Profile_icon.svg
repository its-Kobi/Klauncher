<svg xmlns="http://w3.org" viewBox="0 0 8 8" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Skin/Face Base -->
  <rect width="8" height="8" fill="#C68958"/>
  
  <!-- Hair (Top and Sides) -->
  <rect width="8" height="2" fill="#2E190A"/>
  <rect y="2" width="1" height="3" fill="#2E190A"/>
  <rect x="7" y="2" width="1" height="3" fill="#2E190A"/>
  
  <!-- Eyes (White part) -->
  <rect x="1" y="4" width="1" height="1" fill="#FFFFFF"/>
  <rect x="6" y="4" width="1" height="1" fill="#FFFFFF"/>
  
  <!-- Pupils (Purple/Blue) -->
  <rect x="2" y="4" width="1" height="1" fill="#463A9E"/>
  <rect x="5" y="4" width="1" height="1" fill="#463A9E"/>
  
  <!-- Nose/Mouth Area (Beard/Lips) -->
  <rect x="2" y="5" width="4" height="1" fill="#965836"/>
  <rect x="2" y="6" width="4" height="1" fill="#5C2E16"/>
  <rect x="3" y="5" width="2" height="1" fill="#C68958"/>
</svg>
